name: validate-clusterdocs-ng

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clusterdocs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: rcc-ci
    timeout-minutes: 30
    steps:
      - name: Checkout the exact Gitea commit without an external action
        env:
          GITEA_ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /opt/rcc-ci/bin/gitea-ci-checkout
      - name: Verify the immutable runner toolchain
        run: /opt/rcc-ci/venv/bin/python tools/check_ci_environment.py
      - name: Validate repository and public-content boundaries
        run: /opt/rcc-ci/venv/bin/python tools/validate_repo.py
      - name: Build and theme the review artifact
        run: |
          set -eu
          /opt/rcc-ci/venv/bin/python tools/build_site.py --output site
          /opt/rcc-ci/venv/bin/python tools/apply_rcc_visual_theme.py site
          /opt/rcc-ci/venv/bin/python tools/apply_rcc_visual_theme.py site
      - name: Validate links after the RCC visual theme
        run: /opt/rcc-ci/venv/bin/python tools/check_site_links.py site
