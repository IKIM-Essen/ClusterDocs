name: validate-clusterdocs-3-fallback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clusterdocs-3-github-fallback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg
      - run: pip install -r ci/requirements.txt
      - run: python tools/validate_repo.py
      - run: python tools/build_site.py --output site
